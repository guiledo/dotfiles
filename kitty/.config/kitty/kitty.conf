
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 20.0

# Smart Copy/Paste Configuration

# 1. COPY (Smart)
# If text is selected, copy to clipboard.
# If NO selection, send SIGINT (Interrupt) signal to terminal.
map ctrl+c copy_or_interrupt

# 2. PASTE
# Force paste from system clipboard, ignoring shell's "Verbatim Insert".
map ctrl+v paste_from_clipboard

# Escape Route: Ctrl+Shift+V sends original signal
# \x16 is the ASCII hexadecimal code for Control-V (Synchronous Idle)
map ctrl+shift+v send_text all \x16

