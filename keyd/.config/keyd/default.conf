[ids]
*

[global]
overload_tap_timeout = 300

[main]

# Tap for menu, hold for super
leftmeta = overload(meta, pause)

# Maps CapsLock to 'overload(control, esc)'
# Hold = Control
# Tap = Escape
capslock = overload(control, esc)

# Optional: Remaps the physical Left Control to be CapsLock
# (Useful if you ever actually need CapsLock functionality)
leftcontrol = capslock
